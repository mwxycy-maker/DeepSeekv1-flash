   ========================================================= */
plight(0xffe3b8,1.45,9.5,-.5,2.45,-3.1,4.4);
plight(0xffe3b8,1.25,9,2.6,2.45,-2.6,4.45);
plight(0xffd9a6,1.0,7.5,.3,2.25,1.0,4.5,humFlick);
interiorMats.forEach(m=>swEmis(m,4.35+Math.random()*.15));

/* =========================================================
   RAIN, RIPPLES, DRIPS, GLASS STREAKS, STEAM
   ========================================================= */
function floorY(x,z){
  if(x>-2.75&&x<4.75&&z>-5.75&&z<-.25) return 3.56;
  if(x>-2.85&&x<4.85&&z>=-.25&&z<.8) return 2.66;
  if(x>-3.65&&x<=-2.75&&z>-5.5&&z<-.25) return 2.66;
  if(x>6.4&&z<-1.4) return 6.3;
  if((z>4.6&&z<6&&x>-6)||(x>-6&&x<-4.6&&z<6)) return .12;
  return 0;
}
const RN=reduce?700:1800;
const rPos=new Float32Array(RN*6),rSpd=new Float32Array(RN);
const WX=.12,WZ=.05,LEN=.42;
function setDrop(i,x,y,z){const k=i*6;rPos[k]=x;rPos[k+1]=y;rPos[k+2]=z;rPos[k+3]=x-WX*LEN;rPos[k+4]=y+LEN;rPos[k+5]=z-WZ*LEN;}
for(let i=0;i<RN;i++){rSpd[i]=rand(12,17);setDrop(i,rand(-10,10),rand(0,17),rand(-10,10));}
const rGeo=new THREE.BufferGeometry();rGeo.setAttribute('position',new THREE.BufferAttribute(rPos,3));
const rainMat=new THREE.LineBasicMaterial({color:0xaec4f0,transparent:true,opacity:0,depthWrite:false});
const rain=new THREE.LineSegments(rGeo,rainMat);rain.frustumCulled=false;rain.renderOrder=5;scene.add(rain);

const ripG=new THREE.RingGeometry(.84,1,32);ripG.rotateX(-PI/2);
const rips=[];for(let i=0;i<80;i++){const m=new THREE.Mesh(ripG,new THREE.MeshBasicMaterial({color:0xd5e4ff,transparent:true,opacity:0,depthWrite:false}));m.visible=false;m.renderOrder=4;scene.add(m);rips.push({m,life:0,max:1,size:.3});}
let ripI=0;
function ripple(x,y,z,size,life){const r=rips[ripI++%rips.length];r.m.position.set(x,y+.015,z);r.life=1e-4;r.max=life;r.size=size;r.m.visible=true;}
function inPuddle(x,z){for(const p of puddleDefs){const dx=(x-p.x)/p.rx,dz=(z-p.z)/p.rz;if(dx*dx+dz*dz<.7)return true;}return false;}

const dripGeo=new THREE.SphereGeometry(.03,8,6);
const dripMat=new THREE.MeshBasicMaterial({color:0xd9e8ff,transparent:true,opacity:.9});
const drips=[];
function addDrip(x,y,z){const m=new THREE.Mesh(dripGeo,dripMat);m.visible=false;scene.add(m);drips.push({m,x,y,z,state:0,t:rand(0,3),vy:0,cy:y,fy:floorY(x,z+.001)>2?0:floorY(x,z)});}
for(let x=-2.5;x<=4.6;x+=.85)addDrip(x+rand(-.1,.1),2.5,.8);
for(let z=-5.0;z<=-.6;z+=1.1)addDrip(-3.66,2.5,z+rand(-.1,.1));
[6.8,8.0,9.4].forEach(x=>addDrip(x,3.15,-.62));
drips.forEach(d=>{d.fy=(d.z>4.6&&d.z<6)?.12:0;});

const gsMat=new THREE.MeshBasicMaterial({color:0xdbe9ff,transparent:true,opacity:.45,depthWrite:false});
const gsGeo=new THREE.PlaneGeometry(1,1);
const streaks=[];
function newStreak(s,first){
  if(s.face===0){s.u=Math.random()<.32?rand(-2.52,-1.68):rand(.28,2.52);}else{s.u=rand(-4.52,-.48);}
  s.y=first?rand(.3,2.6):rand(1.8,2.62);s.len=rand(.02,.08);s.v=0;s.moving=Math.random()<.4;s.speed=rand(.25,.8);
}
for(let i=0;i<54;i++){const face=i<30?0:1;const m=new THREE.Mesh(gsGeo,gsMat);m.visible=false;m.renderOrder=6;if(face===1)m.rotation.y=-PI/2;scene.add(m);const s={m,face};newStreak(s,true);streaks.push(s);}

const steamMat=[];const steams=[];
for(let i=0;i<9;i++){const mt=new THREE.SpriteMaterial({map:texSoft,color:0xffffff,transparent:true,opacity:0,depthWrite:false});const sp=new THREE.Sprite(mt);sp.visible=false;scene.add(sp);
  const src=i<6?V(3.45,1.28,-3.3):V(2.0,1.12,-.8);steams.push({sp,mt,src,t:rand(0,2.5),dur:rand(1.8,2.6)});}

/* =========================================================
   POST PROCESSING
   ========================================================= */
let composer=null,bloom=null;
if(THREE.EffectComposer&&THREE.UnrealBloomPass){
  composer=new THREE.EffectComposer(renderer);
  composer.addPass(new THREE.RenderPass(scene,camera));
  bloom=new THREE.UnrealBloomPass(new THREE.Vector2(W(),H()),.62,.42,.8);
  composer.addPass(bloom);
}
function onResize(){
  const w=W(),h=H();renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();
  if(composer)composer.setSize(w,h);
}
window.addEventListener('resize',onResize);

/* =========================================================
   ANIMATION LOOP
   ========================================================= */
const eOutBack=p=>{const c1=1.55,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2);};
const eOutCubic=p=>1-Math.pow(1-p,3);
const eInOut=p=>p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
let partsDone=false;
function animParts(T){
  let all=true;
  for(const o of parts){
    const u=o.userData.b;const p=(T-u.t)/u.d;
    if(p<=0){o.visible=false;all=false;continue;}
    o.visible=true;
    if(p>=1){if(!u.done){o.scale.copy(u.s);o.position.copy(u.p);u.done=true;}continue;}
    all=false;
    const e=Math.max(1e-3,eOutBack(p)),c=Math.max(1e-3,eOutCubic(p));
    if(u.m==='rise'){o.scale.set(u.s.x,u.s.y*e,u.s.z);o.position.copy(u.p);}
    else if(u.m==='flat'){o.scale.set(u.s.x*c,u.s.y,u.s.z*c);}
    else if(u.m==='flatxy'){o.scale.set(u.s.x*c,u.s.y*c,u.s.z);}
    else if(u.m==='wire'){o.scale.set(u.s.x*c,u.s.y*c,u.s.z*c);}
    else{o.scale.set(u.s.x*e,u.s.y*e,u.s.z*e);o.position.set(u.p.x,u.p.y+(1-c)*1.6,u.p.z);}
  }
  if(all)partsDone=true;
}
function updateSwitches(T){
  for(const s of switches){
    const p=T-s.t;let v;
    if(p<0)v=0;else if(p<.55)v=(Math.sin(p*93)+Math.sin(p*57+1.3))>.35?1:.12;else v=1;
    if(s.mod&&v>0)v*=s.mod(T);
    s.set(v);
  }
}
function setSignal(sg,state,T){const idx=state==='g'?0:state==='y'?1:2;sg.mats.forEach((m,i)=>{m.color.copy(sg.cols[i]).multiplyScalar(i===idx?1:.1);});}
function doorOpen(T){if(T<6.5)return 0;const k=Math.floor((T-6.5)/8.5);const c=(T-6.5)-k*8.5;if(hash(k+11)<.3)return 0;if(c<.7)return eInOut(c/.7);if(c<3.0)return 1;if(c<3.9)return 1-eInOut((c-3)/.9);return 0;}

const clock=new THREE.Clock();
const T0=reduce?12:0;
let ripBudget=0;
function frame(){
  const dt=Math.min(clock.getDelta(),.05);
  const T=clock.elapsedTime+T0;
  if(!partsDone)animParts(T);
  updateSwitches(T);
  if(refl)refl.material.uniforms.time.value=T;
  if(refl&&puddleMat.uniforms){puddleMat.uniforms.reflInv.value.copy(refl.matrixWorld).invert();}

  /* door */
  const d=doorOpen(T);doorL.position.x=-1.15-d*.86;doorR.position.x=-.25+d*.86;

  /* traffic signals */
  if(T>4.8){
    const c=(T-4.8)%18;
    setSignal(sigFront,c<7?'g':c<9.5?'y':'r',T);
    setSignal(sigSide,c<9.8?'r':c<16.3?'g':c<17.8?'y':'r',T);
    const cf=(T+6)%18;setSignal(sigFar,cf<9.8?'r':cf<16.3?'g':cf<17.8?'y':'r',T);
    let pg=c>10.2&&c<15.6;const blink=c>=15.6&&c<16.8&&Math.sin(T*18)>0;
    ped.grn.color.setScalar(pg||blink?1:.1);ped.red.color.setScalar(pg||blink?.1:1);
  }else{signals.forEach(s=>s.mats.forEach(m=>m.color.setScalar(.06)));ped.grn.color.setScalar(.06);ped.red.color.setScalar(.06);}

  /* fans */
  if(T>3.6)fans.forEach(f=>f.fan.rotation.z-=f.s*dt);

  /* rain */
  const rainOn=clamp((T-4.2)/2,0,1);
  rainMat.opacity=.42*rainOn;
  if(rainOn>0){
    ripBudget=Math.min(ripBudget+dt*38,6);
    for(let i=0;i<RN;i++){
      const k=i*6;const s=rSpd[i]*dt;
      let x=rPos[k]+WX*s,y=rPos[k+1]-s,z=rPos[k+2]+WZ*s;
      if(x>10)x-=20;if(z>10)z-=20;
      const fy=floorY(x,z);
      if(y<=fy){
        if(ripBudget>=1&&rainOn>.5){
          const pud=fy===0&&inPuddle(x,z);
          if(pud&&Math.random()<.85){ripple(x,fy,z,rand(.16,.28),rand(.7,1.0));ripBudget--;}
          else if(Math.random()<.16){ripple(x,fy,z,rand(.06,.12),rand(.35,.5));ripBudget--;}
        }
        x=rand(-10,10);z=rand(-10,10);y=rand(14,18);
      }
      setDrop(i,x,y,z);
    }
    rGeo.attributes.position.needsUpdate=true;
  }
  for(const r of rips){if(r.life<=0)continue;r.life+=dt;const p=r.life/r.max;if(p>=1){r.life=0;r.m.visible=false;continue;}const s=.02+p*r.size;r.m.scale.set(s,1,s);r.m.material.opacity=(1-p)*(1-p)*.7;}

  /* eave drips */
  if(rainOn>.3){
    for(const dr of drips){
      if(dr.state===0){dr.t-=dt;if(dr.t<=0){dr.state=1;dr.t=0;dr.m.visible=true;dr.cy=dr.y;dr.m.position.set(dr.x,dr.y,dr.z);}}
      else if(dr.state===1){dr.t+=dt;const k=clamp(dr.t/.55,0,1);dr.m.scale.set(.4+.6*k,.4+.9*k,.4+.6*k);dr.m.position.y=dr.y-.03*k;if(k>=1){dr.state=2;dr.vy=0;dr.cy=dr.y-.03;}}
      else{dr.vy+=9.8*dt;dr.cy-=dr.vy*dt;dr.m.position.y=dr.cy;dr.m.scale.set(.7,1.9,.7);
        if(dr.cy<=dr.fy){dr.m.visible=false;dr.state=0;dr.t=rand(1.2,4.2);ripple(dr.x,dr.fy,dr.z,rand(.22,.32),.8);}}
    }
  }

  /* glass streaks */
  for(const s of streaks){
    if(rainOn<=0){s.m.visible=false;continue;}
    s.m.visible=true;
    if(s.moving){s.y-=s.speed*dt;s.len=Math.min(s.len+s.speed*dt*.3,.45);if(Math.random()<dt*.9)s.moving=false;}
    else{if(Math.random()<dt*.7){s.moving=true;s.speed=rand(.25,.9);}}
    if(s.y<.16)newStreak(s,false);
    const cy=s.y+s.len/2;
    if(s.face===0)s.m.position.set(s.u,cy,-.355);else s.m.position.set(-2.645,cy,s.u);
    s.m.scale.set(.017,s.len+.03,1);
  }
  gsMat.opacity=.45*rainOn;

  /* steam */
  for(const st of steams){
    if(T<4.6){st.sp.visible=false;continue;}
    st.t+=dt;if(st.t>st.dur){st.t=0;st.dur=rand(1.8,2.6);}
    const p=st.t/st.dur;st.sp.visible=true;
    st.sp.position.set(st.src.x+Math.sin(p*5+st.dur)*.05,st.src.y+p*.55,st.src.z+Math.cos(p*4)*.04);
    const sc=.08+p*.22;st.sp.scale.set(sc,sc,1);st.mt.opacity=Math.sin(p*PI)*.32;
  }

  if(T>6.5&&!touched&&!reduce)controls.autoRotate=true;
  controls.update();
  if(composer)composer.render();else renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
}
})();
</script>
