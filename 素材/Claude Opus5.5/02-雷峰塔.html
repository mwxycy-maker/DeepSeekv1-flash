<style>

const latticeTex = canvasTex(64, 128, latticeDraw('#2b170f', '#c99a4a'));
const paneTex = canvasTex(64, 128, latticeDraw('#ffdca4', '#000000'));

/* ---------- materials ---------- */
const M = {

  wall: new THREE.MeshStandardMaterial({ color: C('#8a2c20'), roughness: .82, emissive: C('#ff8a3c'), emissiveIntensity: 0 }),
  column: new THREE.MeshStandardMaterial({ color: C('#6e1912'), roughness: .55, emissive: C('#ff8a3c'), emissiveIntensity: 0 }),
  beam: new THREE.MeshStandardMaterial({ color: C('#2c5560'), roughness: .7, emissive: C('#ffb060'), emissiveIntensity: 0 }),

/* ---------- helpers ---------- */
function oct(phi){ const u = ((phi % Q) + Q) % Q; const d = u < E ? u : u - Q; return { f: Math.cos(E) / Math.cos(d), c: Math.abs(d) / E }; }
function shadowed(m){ m.castShadow = true; m.receiveShadow = true; return m; }
function addOct(parent, rTop, rBot, h, y, mat){

        const post = shadowed(new THREE.Mesh(new THREE.BoxGeometry(postW, h + .12, postW), mat));

      }

function makeRoof(Ri, Ro, rise, up, steep, closed){

  const N = 16; for (let i = 0; i <= N; i++) { const t = i / N; pts.push(new THREE.Vector2(Ro + (inner - Ro) * t, rise * Math.pow(t, steep))); }

    const x = p.getX(i), y = p.getY(i), z = p.getZ(i), r = Math.hypot(x, z);

/* ---------- terrain: Xizhao Hill ---------- */
function terrainH(x, z){

{
  const g = new THREE.PlaneGeometry(320, 320, 180, 180); g.rotateX(-PI / 2);

  const pave = C('#9a9384'), edge = C('#6f6a58'), mud = C('#5c5644'), g1 = C('#34502a'), g2 = C('#5a6c36'), tmp = new THREE.Color();

    cols.push(tmp.r, tmp.g, tmp.b);
  }
  g.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3)); g.computeVertexNormals();

  ground.receiveShadow = true; scene.add(ground);

  const tg = new THREE.IcosahedronGeometry(1, 0), tm = new THREE.MeshStandardMaterial({ roughness: .9, flatShading: true });
  const greens = ['#2f4a26', '#3b5a2c', '#28401f', '#46602f', '#33522b'].map(C), autumn = ['#9a5a26', '#b07a2e', '#8a3a22'].map(C);

    const s = 1.5 + rand() * 2.3;
    d.position.set(x, h + s * .85, z); d.scale.set(s, s * (1.1 + rand() * .5), s); d.rotation.set(rand(), rand() * 6, rand()); d.updateMatrix();
    trees.setMatrixAt(n, d.matrix); trees.setColorAt(n, rand() < .14 ? autumn[n % 3] : greens[n % 5]); n++;
  }
  trees.count = n; trees.castShadow = true; trees.receiveShadow = true; scene.add(trees);

  // hills around West Lake
  const mm = new THREE.MeshStandardMaterial({ color: C('#33463d'), roughness: 1, flatShading: true });
  for (let i = 0; i < 26; i++) {
    const a = i / 26 * 2 * PI + rand() * .2, dist = 430 + rand() * 200, rad = 70 + rand() * 80, h = 40 + rand() * 60;
    const cg = new THREE.ConeGeometry(rad, h, 9, 3), cp = cg.attributes.position;
    for (let j = 0; j < cp.count; j++) { if (cp.getY(j) > h / 2 - .01) continue; cp.setX(j, cp.getX(j) * (.9 + rand() * .2)); cp.setZ(j, cp.getZ(j) * (.9 + rand() * .2)); cp.setY(j, cp.getY(j) + (rand() - .5) * 6); }
    cg.computeVertexNormals();
    const m = new THREE.Mesh(cg, mm); m.position.set(Math.sin(a) * dist, h / 2 - 5, Math.cos(a) * dist); m.scale.x = 1.4; m.rotation.y = a; scene.add(m);
  }
}

/* ---------- West Lake ---------- */
function waterNormals(){
  const N = 256, data = new Uint8Array(N * N * 4);
  const hf = (x, y) => { const u = x / N * 2 * PI, v = y / N * 2 * PI;
    return Math.sin(u * 3 + v * 2) * .5 + Math.sin(u * 7 - v * 5 + 1.3) * .25 + Math.sin(u * 13 + v * 11 + .7) * .12 + Math.sin(-u * 5 + v * 17 + 2.1) * .1; };
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    let nx = -(hf(x + 1, y) - hf(x - 1, y)) * 14, ny = -(hf(x, y + 1) - hf(x, y - 1)) * 14, nz = 1;
    const l = Math.hypot(nx, ny, nz); nx /= l; ny /= l; nz /= l; const i = (y * N + x) * 4;
    data[i] = (nx * .5 + .5) * 255; data[i + 1] = (ny * .5 + .5) * 255; data[i + 2] = (nz * .5 + .5) * 255; data[i + 3] = 255;
  }
  const t = new THREE.DataTexture(data, N, N); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(60, 60); t.needsUpdate = true; return t;
}
const waterTex = waterNormals();
const waterMat = new THREE.MeshStandardMaterial({ color: C('#2c5a68'), roughness: .12, metalness: .85, normalMap: waterTex, normalScale: new THREE.Vector2(.35, .35) });
const water = new THREE.Mesh(new THREE.PlaneGeometry(3200, 3200), waterMat);
water.rotation.x = -PI / 2; water.position.y = .25; water.receiveShadow = true; scene.add(water);

/* ---------- the pagoda ---------- */
const pagoda = new THREE.Group(); pagoda.position.y = 12.5; scene.add(pagoda);
// two-tier stone platform with stairs on four sides
addOct(pagoda, 17, 17.4, 1.8, .9, M.stone);
addOct(pagoda, 13.2, 13.4, 1.4, 2.5, M.stone);
railing(pagoda, 16.6, 1.8, 1.0, M.stoneLight, [0, 2, 4, 6], .34);
railing(pagoda, 12.8, 3.2, .9, M.stoneLight, [0, 2, 4, 6], .3);
for (const face of [0, 2, 4, 6]) {
  const phi = face * Q, steps = (a0, top, bottom, n) => {
    for (let i = 0; i < n; i++) {
      const t = bottom + (top - bottom) * (1 - (i + 1) / (n + 1)), dist = a0 + (i + .5) * .85;
      const m = shadowed(new THREE.Mesh(new THREE.BoxGeometry(5.4, t, .85), M.stoneLight));
      m.position.set(Math.sin(phi) * dist, t / 2, Math.cos(phi) * dist); m.rotation.y = phi; pagoda.add(m);
    }
  };
  steps(17 * Math.cos(E), 1.8, 0, 6);
  steps(13.2 * Math.cos(E), 3.2, 1.8, 4);
}
// warm uplights for the night view
const lamps = [];
for (let k = 0; k < 4; k++) { const l = new THREE.PointLight(C('#ffb066'), 0, 95, 1); l.position.copy(corner(k * 2, 15, 5)); pagoda.add(l); lamps.push(l); }

const Rs = [8.6, 7.8, 7.1, 6.4, 5.8], Hs = [6.4, 5.0, 4.6, 4.3, 4.0];
const overs = [3.7, 3.1, 2.9, 2.7, 2.7], rises = [2.6, 2.2, 2.1, 2.0, 5.4], ups = [1.15, 1.0, .95, .9, 1.0];
const bracketGeo = new THREE.BoxGeometry(.5, .55, 1.3), dmy = new THREE.Object3D();
let y = 3.2;
for (let i = 0; i < 5; i++) {
  const R = Rs[i], H = Hs[i], top = i === 4;
  addOct(pagoda, R * .985, R, H, y + H / 2, M.wall);
  for (let k = 0; k < 8; k++) {
    const c = corner(k, R); const col = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(.34, .38, H, 12), M.column));
    col.position.set(c.x, y + H / 2, c.z); pagoda.add(col);
  }
  const ap = R * Math.cos(E), faceW = 2 * R * Math.sin(E);
  for (let m = 0; m < 8; m++) {
    const phi = m * Q, isDoor = m % 2 === 0, w = faceW * (isDoor ? .46 : .34), h = isDoor ? H * .6 : H * .36;
    const yc = isDoor ? y + h / 2 + .2 : y + H * .52;
    const frame = new THREE.Mesh(new THREE.BoxGeometry(w + .4, h + .4, .14), M.bracket);
    frame.position.set(Math.sin(phi) * (ap + .02), yc, Math.cos(phi) * (ap + .02)); frame.rotation.y = phi; pagoda.add(frame);
    const door = new THREE.Mesh(new THREE.BoxGeometry(w, h, .16), M.door);
    door.position.set(Math.sin(phi) * (ap + .06), yc, Math.cos(phi) * (ap + .06)); door.rotation.y = phi; pagoda.add(door);
  }
  addOct(pagoda, R + .22, R + .22, .6, y + H - .15, M.beam);
  const br = new THREE.InstancedMesh(bracketGeo, M.bracket, 24); let n = 0;
  for (let k = 0; k < 8; k++) for (const t of [0, 1 / 3, 2 / 3]) {
    const p = corner(k, R + .1).lerp(corner(k + 1, R + .1), t), ang = t === 0 ? E + k * Q : (k + 1) * Q;
    p.x += Math.sin(ang) * .45; p.z += Math.cos(ang) * .45;
    dmy.position.set(p.x, y + H + .4, p.z); dmy.rotation.set(0, ang, 0); dmy.updateMatrix(); br.setMatrixAt(n++, dmy.matrix);
  }
  br.castShadow = true; pagoda.add(br);
  addOct(pagoda, R + 1.0, R + .8, .2, y + H + .75, M.bracket);

  const rb = y + H + .95, Ri = R + .3, Ro = R + overs[i];
  const roof = makeRoof(Ri, Ro, rises[i], ups[i], top ? 1.6 : 1.9, top); roof.position.y = rb; pagoda.add(roof);
  roofDetails(pagoda, rb, Ri, Ro, rises[i], ups[i], top ? 1.6 : 1.9, top);

  if (!top) {
    const Rn = Rs[i + 1], py = rb + rises[i] - .15;
    addOct(pagoda, Rn + 1.5, Rn + 1.3, .45, py + .225, M.floor);
    railing(pagoda, Rn + 1.35, py + .45, .85, M.rail);
    y = py + .45;
  } else {
    // finial (塔刹)
    const a = rb + rises[i];
    const add = (geo, yy, sy = 1) => { const m = shadowed(new THREE.Mesh(geo, M.gold)); m.position.y = yy; m.scale.y = sy; pagoda.add(m); return m; };
    add(new THREE.CylinderGeometry(.9, 1.15, .7, 16), a + .2);
    add(new THREE.SphereGeometry(1.05, 20, 10, 0, 2 * PI, 0, PI / 2), a + .55, .8);
    add(new THREE.CylinderGeometry(.13, .13, 9.2, 8), a + 5.0);
    for (let j = 0; j < 7; j++) { const r = .82 - j * .055; add(new THREE.CylinderGeometry(r, r, .16, 20), a + 1.9 + j * .58); }
    add(new THREE.ConeGeometry(1.05, .55, 8), a + 6.3);
    add(new THREE.SphereGeometry(.46, 18, 12), a + 7.15, 1.35);
    add(new THREE.SphereGeometry(.28, 14, 10), a + 7.95);
    add(new THREE.ConeGeometry(.1, 1.0, 8), a + 8.6);
  }
}

/* ---------- times of day ---------- */
const V = (x, y, z) => new THREE.Vector3(x, y, z).normalize();
const PRESETS = {
  day: { top: C('#3f78b8'), horizon: C('#c9dce6'), bottom: C('#8aa3ad'), sunColor: C('#fff1d6'), sunDir: V(.45, .82, .35),
    sunI: 2.6, hemiSky: C('#b7d1ea'), hemiGround: C('#5a5c42'), hemiI: .9, exposure: .85, sunSize: .9994, glow: .6, water: C('#2c5a68'), night: 0 },
  dusk: { top: C('#2a2f5c'), horizon: C('#f0925a'), bottom: C('#5b3c4c'), sunColor: C('#ff8c4a'), sunDir: V(-.85, .13, .5),
    sunI: 2.4, hemiSky: C('#f2b08a'), hemiGround: C('#4a3530'), hemiI: .75, exposure: .95, sunSize: .9991, glow: 1.4, water: C('#3a3448'), night: .15 },
  night: { top: C('#060a1c'), horizon: C('#1c2748'), bottom: C('#080a14'), sunColor: C('#cfd8ff'), sunDir: V(.45, .55, -.7),
    sunI: .45, hemiSky: C('#3a4a80'), hemiGround: C('#0c0e16'), hemiI: .5, exposure: 1.1, sunSize: .99975, glow: .5, water: C('#0a1424'), night: 1 }
};
function cloneState(s){ const o = {}; for (const k in s) o[k] = s[k] && s[k].clone ? s[k].clone() : s[k]; return o; }
function lerpState(a, b, t, out){
  for (const k in a) {
    if (a[k] instanceof THREE.Color) out[k].copy(a[k]).lerp(b[k], t);
    else if (a[k] instanceof THREE.Vector3) out[k].copy(a[k]).lerp(b[k], t).normalize();
    else out[k] = a[k] + (b[k] - a[k]) * t;
  }
}
const cur = cloneState(PRESETS.dusk);
function apply(s){
  skyU.top.value.copy(s.top); skyU.horizon.value.copy(s.horizon); skyU.bottom.value.copy(s.bottom);
  skyU.sunDir.value.copy(s.sunDir); skyU.sunColor.value.copy(s.sunColor); skyU.sunSize.value = s.sunSize; skyU.glow.value = s.glow;
  scene.fog.color.copy(s.horizon);
  sun.color.copy(s.sunColor).lerp(new THREE.Color(1, 1, 1), .35); sun.intensity = s.sunI;
  sun.position.copy(s.sunDir).multiplyScalar(250).add(sun.target.position);
  hemi.color.copy(s.hemiSky); hemi.groundColor.copy(s.hemiGround); hemi.intensity = s.hemiI;
  renderer.toneMappingExposure = s.exposure;
  const n = s.night;
  M.wall.emissiveIntensity = .12 * n; M.column.emissiveIntensity = .1 * n; M.beam.emissiveIntensity = .3 * n;
  M.bracket.emissiveIntensity = .4 * n; M.gold.emissiveIntensity = .4 * n; M.door.emissiveIntensity = .1 + 1.9 * n;
  M.glow.opacity = Math.max(0, (n - .2) / .8); starMat.opacity = n;
  for (const l of lamps) l.intensity = 2.2 * Math.max(0, (n - .2) / .8);
  waterMat.color.copy(s.water);
}
apply(cur); updateEnv();

let trans = null;
function setPreset(name){
  document.querySelectorAll('[data-preset]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.preset === name)));
  if (reduce) { lerpState(PRESETS[name], PRESETS[name], 1, cur); apply(cur); updateEnv(); return; }
  trans = { from: cloneState(cur), to: PRESETS[name], t: 0, frame: 0 };
}
document.querySelectorAll('[data-preset]').forEach(b => b.addEventListener('click', () => setPreset(b.dataset.preset)));
const spinBtn = document.getElementById('spin');
spinBtn.setAttribute('aria-pressed', String(controls.autoRotate));
spinBtn.addEventListener('click', () => { controls.autoRotate = !controls.autoRotate; spinBtn.setAttribute('aria-pressed', String(controls.autoRotate)); });
let homing = null;
document.getElementById('reset').addEventListener('click', () => {
  if (reduce) { camera.position.copy(HOME_POS); controls.target.copy(HOME_TGT); return; }
  homing = { p0: camera.position.clone(), t0: controls.target.clone(), t: 0 };
});
controls.addEventListener('start', () => { homing = null; });

function resize(){ const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

const clock = new THREE.Clock(); let first = true;
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
function frame(){
  const dt = Math.min(clock.getDelta(), .1);
  waterTex.offset.x += dt * .006; waterTex.offset.y += dt * .004;
  if (trans) {
    trans.t = Math.min(1, trans.t + dt / 1.8); trans.frame++;
    lerpState(trans.from, trans.to, ease(trans.t), cur); apply(cur);
    if (trans.frame % 8 === 0 || trans.t >= 1) updateEnv();
    if (trans.t >= 1) trans = null;
  }
  if (homing) {
    homing.t = Math.min(1, homing.t + dt / 1.3); const e = ease(homing.t);
    camera.position.copy(homing.p0).lerp(HOME_POS, e); controls.target.copy(homing.t0).lerp(HOME_TGT, e);
    if (homing.t >= 1) homing = null;
  }
  controls.target.y = Math.min(70, Math.max(8, controls.target.y));
  const tr = Math.hypot(controls.target.x, controls.target.z); if (tr > 60) { controls.target.x *= 60 / tr; controls.target.z *= 60 / tr; }
  controls.update();
  renderer.render(scene, camera);
  if (first) { first = false; loading.classList.add('fade'); setTimeout(() => { loading.hidden = true; }, 900); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
